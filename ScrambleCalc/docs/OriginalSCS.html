<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scramble Handicap Calculator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f0f2f1; color: #1a1a2e; line-height: 1.5;
}
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
.hidden { display: none !important; }

/* Header */
header {
  background: linear-gradient(135deg, #1b4332, #2d6a4f);
  color: #fff; padding: 20px 0; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
header .container { display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 1.4rem; font-weight: 700; }
header .subtitle { font-size: 0.85rem; opacity: 0.85; }

/* Cards */
.card {
  background: #fff; border-radius: 10px; padding: 24px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px;
}
.card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; color: #1b4332; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 20px; border: none; border-radius: 8px;
  font-size: 0.9rem; font-weight: 500; cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
}
.btn:hover { opacity: 0.9; }
.btn-primary { background: #2d6a4f; color: #fff; }
.btn-secondary { background: #e9ecef; color: #1a1a2e; }
.btn-danger { background: #e63946; color: #fff; }
.btn-success { background: #40916c; color: #fff; }
.btn-warning { background: #e9c46a; color: #1a1a2e; }
.btn-sm { padding: 6px 14px; font-size: 0.82rem; }

/* Forms */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-weight: 500; margin-bottom: 4px; font-size: 0.88rem; color: #333; }
.form-group input, .form-group select {
  width: 100%; padding: 10px 12px; border: 1.5px solid #d4d4d4; border-radius: 8px;
  font-size: 0.95rem; transition: border-color 0.15s;
}
.form-group input:focus, .form-group select:focus { outline: none; border-color: #2d6a4f; }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }
.form-inline { display: flex; gap: 8px; align-items: end; }
.form-inline .form-group { margin-bottom: 0; flex: 1; }

/* Team block */
.team-block {
  background: #f8faf9; border: 1.5px solid #e0e4e2; border-radius: 10px;
  padding: 18px; margin-bottom: 14px; position: relative;
}
.team-block-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px; padding-bottom: 10px;
  border-bottom: 1px solid #e0e4e2;
}
.team-block-header h3 { font-size: 0.95rem; color: #1b4332; }
.team-number { font-weight: 600; }
.player-row {
  display: flex; gap: 10px; margin-bottom: 8px; align-items: end;
}
.player-row .form-group { margin-bottom: 0; flex: 1; }
.player-label {
  font-size: 0.78rem; font-weight: 600; color: #555;
  min-width: 28px; padding: 10px 0; text-align: center;
}

/* Scoresheet table */
.scoresheet-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.scoresheet-table th {
  background: #1b4332; color: #fff; padding: 10px 12px;
  text-align: left; font-weight: 500; font-size: 0.82rem;
}
.scoresheet-table th:first-child { border-radius: 8px 0 0 0; }
.scoresheet-table th:last-child { border-radius: 0 8px 0 0; }
.scoresheet-table td { padding: 10px 12px; border-bottom: 1px solid #e0e4e2; vertical-align: middle; }
.scoresheet-table tr:last-child td { border-bottom: none; }
.scoresheet-table .team-name-cell { font-weight: 600; }
.scoresheet-table .players-list { font-size: 0.82rem; color: #555; }
.scoresheet-table .hcp-cell { font-weight: 600; color: #2d6a4f; text-align: center; }
.scoresheet-table .score-input { width: 72px; padding: 8px; text-align: center; border: 1.5px solid #d4d4d4; border-radius: 6px; font-size: 0.95rem; }
.scoresheet-table .score-input:focus { outline: none; border-color: #2d6a4f; }
.scoresheet-table .net-cell { font-weight: 600; font-size: 1rem; text-align: center; }
.scoresheet-table .winner-row { background: #d8f3dc; }
.scoresheet-table .winner-row td { border-bottom-color: #b7e4c7; }
.scoresheet-table .winner-row .team-name-cell,
.scoresheet-table .winner-row .net-cell { color: #1b4332; }

/* Winner banner */
.winner-banner {
  background: linear-gradient(135deg, #1b4332, #2d6a4f);
  color: #fff; border-radius: 10px; padding: 20px 24px;
  text-align: center; margin-top: 16px;
}
.winner-banner h2 { font-size: 1.3rem; margin-bottom: 4px; }
.winner-banner p { font-size: 0.95rem; opacity: 0.9; }
.winner-banner .trophy { font-size: 2rem; }

/* Scoresheet header meta */
.meta-grid { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
.meta-item { font-size: 0.85rem; color: #555; }
.meta-item strong { color: #1a1a2e; }

/* Saved list */
.scoresheet-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 0; border-bottom: 1px solid #e0e4e2;
}
.scoresheet-item:last-child { border-bottom: none; }
.scoresheet-item-info h3 { font-size: 0.95rem; color: #1b4332; }
.scoresheet-item-info p { font-size: 0.82rem; color: #666; }
.scoresheet-item-actions { display: flex; gap: 8px; flex-shrink: 0; }

/* Empty state */
.empty-state { text-align: center; padding: 40px 20px; color: #888; }
.empty-state p { font-size: 0.95rem; margin-bottom: 16px; }

/* Nav */
.nav-bar {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
}
.nav-bar .back-btn { cursor: pointer; color: #2d6a4f; font-size: 0.88rem; font-weight: 500; background: none; border: none; display: flex; align-items: center; gap: 4px; }
.nav-bar .back-btn:hover { text-decoration: underline; }

/* Import */
.import-wrap { position: relative; overflow: hidden; }
.import-wrap input[type=file] {
  position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
}

/* Drop zone */
.drop-zone {
  border: 2px dashed #bbb; border-radius: 10px; padding: 30px 20px;
  text-align: center; color: #888; transition: background 0.15s, border-color 0.15s;
  margin-bottom: 16px; cursor: pointer;
}
.drop-zone.dragover { background: #d8f3dc; border-color: #2d6a4f; color: #1b4332; }
.drop-zone p { font-size: 0.9rem; }
.drop-zone .icon { font-size: 1.8rem; margin-bottom: 8px; }

/* Scoresheet actions bar */
.scoresheet-actions {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
}

/* Completed badge */
.completed-badge {
  display: inline-block; background: #e9c46a; color: #1a1a2e;
  font-size: 0.72rem; font-weight: 600; padding: 2px 8px;
  border-radius: 4px; margin-left: 6px; text-transform: uppercase;
}

/* Responsive */
@media (max-width: 640px) {
  .container { padding: 12px; }
  .form-row { flex-direction: column; gap: 0; }
  .player-row { flex-wrap: wrap; }
  .player-row .form-group { min-width: calc(50% - 10px); }
  .scoresheet-item { flex-direction: column; align-items: start; gap: 10px; }
  .scoresheet-item-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
  .scoresheet-table { font-size: 0.8rem; }
  .scoresheet-table td, .scoresheet-table th { padding: 8px 6px; }
  .scoresheet-table .score-input { width: 56px; padding: 6px; }
  .meta-grid { gap: 12px; }
  .scoresheet-actions { flex-direction: column; }
  .scoresheet-actions .btn { width: 100%; justify-content: center; }
}

/* Utilities */
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }
.text-center { text-align: center; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.gap-8 { gap: 8px; }
</style>
</head>
<body>

<header>
  <div class="container">
    <div>
      <h1>Scramble Handicap Calculator</h1>
      <div class="subtitle">Team handicap &amp; scoring for scramble golf tournaments</div>
    </div>
  </div>
</header>

<div class="container">

<!-- ============= HOME SCREEN ============= -->
<div id="screen-home" class="screen">
  <div class="flex-between mb-16">
    <h2 style="font-size:1.1rem;color:#1b4332;">Saved Scoresheets</h2>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary" onclick="showSetup()">+ New Scoresheet</button>
      <button class="btn btn-secondary import-wrap">
        Import JSON
        <input type="file" accept=".json" onchange="importScoresheet(event)">
      </button>
    </div>
  </div>
  <div class="drop-zone" id="drop-zone" onclick="document.querySelector('.import-wrap input').click()">
    <div class="icon">📂</div>
    <p><strong>Drop a .json file here</strong> or click to import</p>
  </div>
  <div class="card" id="home-list"></div>
</div>

<!-- ============= SETUP SCREEN ============= -->
<div id="screen-setup" class="screen hidden">
  <div class="nav-bar">
    <button class="back-btn" onclick="cancelSetup()">&larr; Back</button>
  </div>
  <div class="card">
    <div class="card-title" id="setup-title">New Scoresheet</div>
    <div class="form-row">
      <div class="form-group">
        <label>Tournament Name</label>
        <input type="text" id="setup-name" placeholder="e.g. Annual Charity Scramble">
      </div>
      <div class="form-group">
        <label>Course Name</label>
        <input type="text" id="setup-course" placeholder="e.g. Pine Valley">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Course Slope Rating</label>
        <input type="number" id="setup-slope" value="113" min="55" max="155">
      </div>
      <div class="form-group">
        <label>Players per Team</label>
        <select id="setup-players" onchange="onPlayersPerTeamChange()">
          <option value="2">2 players</option>
          <option value="3">3 players</option>
          <option value="4" selected>4 players</option>
        </select>
      </div>
    </div>
  </div>

  <div class="flex-between mb-8">
    <h3 style="font-size:1rem;color:#1b4332;">Teams</h3>
    <button class="btn btn-sm btn-secondary" onclick="addTeam()">+ Add Team</button>
  </div>
  <div id="teams-container"></div>

  <button class="btn btn-success mt-16" onclick="saveScoresheet()" style="width:100%;justify-content:center;padding:14px;">
    Save Scoresheet
  </button>
</div>

<!-- ============= SCORESHEET SCREEN ============= -->
<div id="screen-scoresheet" class="screen hidden">
  <div class="nav-bar">
    <button class="back-btn" onclick="showHome()">&larr; Back to Scoresheets</button>
  </div>
  <div class="scoresheet-actions" id="scoresheet-actions"></div>
  <div id="scoresheet-content"></div>
</div>

</div>

<script>
(function() {
  'use strict';

  const STORAGE_KEY = 'scramble_scoresheets';

  let state = {
    scoresheets: [],
    currentEditId: null
  };

  // ==================== STORAGE ====================

  function loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        state.scoresheets = JSON.parse(raw);
      }
    } catch (e) {
      state.scoresheets = [];
    }
  }

  function saveToStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.scoresheets));
    } catch (e) {
      alert('Failed to save. Storage may be full.');
    }
  }

  function generateId() {
    return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  // ==================== NAVIGATION ====================

  window.showHome = function() {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById('screen-home').classList.remove('hidden');
    state.currentEditId = null;
    renderHome();
  };

  window.showSetup = function() {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById('screen-setup').classList.remove('hidden');
    resetSetup();
  };

  function showScoresheet(id) {
    state.currentScoresheetId = id;
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById('screen-scoresheet').classList.remove('hidden');
    renderScoresheet(id);
  }

  window.cancelSetup = function() {
    if (state.currentEditId) {
      showScoresheet(state.currentEditId);
    } else {
      showHome();
    }
  };

  // ==================== HOME SCREEN ====================

  function renderHome() {
    const list = document.getElementById('home-list');
    const sheets = state.scoresheets;

    if (sheets.length === 0) {
      list.innerHTML = '<div class="empty-state"><p>No scoresheets yet.</p><button class="btn btn-primary" onclick="showSetup()">Create Your First Scoresheet</button></div>';
      return;
    }

    let html = '';
    const sorted = [...sheets].sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));
    for (const sheet of sorted) {
      const date = new Date(sheet.updatedAt || sheet.createdAt);
      const dateStr = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      const isCompleted = sheet.completed;
      html += `
        <div class="scoresheet-item">
          <div class="scoresheet-item-info">
            <h3>${escHtml(sheet.name)}${isCompleted ? ' <span class="completed-badge">Completed</span>' : ''}</h3>
            <p>${escHtml(sheet.courseName)} &middot; Slope ${sheet.slope} &middot; ${sheet.playersPerTeam} players/team &middot; ${sheet.teams.length} teams &middot; ${dateStr}</p>
          </div>
          <div class="scoresheet-item-actions">
            <button class="btn btn-sm btn-primary" onclick="openScoresheet('${sheet.id}')">Open</button>
            <button class="btn btn-sm btn-warning" onclick="editScoresheet('${sheet.id}')">Edit</button>
            <button class="btn btn-sm btn-secondary" onclick="exportScoresheet('${sheet.id}')">Export</button>
            <button class="btn btn-sm btn-danger" onclick="deleteScoresheet('${sheet.id}')">Delete</button>
          </div>
        </div>
      `;
    }
    list.innerHTML = html;
  }

  window.openScoresheet = function(id) {
    showScoresheet(id);
  };

  window.deleteScoresheet = function(id) {
    if (!confirm('Delete this scoresheet?')) return;
    state.scoresheets = state.scoresheets.filter(s => s.id !== id);
    saveToStorage();
    renderHome();
  };

  window.exportScoresheet = function(id) {
    const sheet = state.scoresheets.find(s => s.id === id);
    if (!sheet) return;
    downloadJSON(sheet, (sheet.name || 'scoresheet').replace(/\s+/g, '_') + '.json');
  };

  function downloadJSON(data, filename) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ==================== IMPORT / EXPORT ====================

  function importSheetFromJSON(json) {
    try {
      const sheet = JSON.parse(json);
      if (!sheet.name || !sheet.teams || !sheet.playersPerTeam || !sheet.slope) {
        alert('Invalid scoresheet file: missing required fields (name, teams, playersPerTeam, slope).');
        return false;
      }
      for (const team of sheet.teams) {
        if (!team.players || team.players.length !== sheet.playersPerTeam) {
          alert('Invalid scoresheet: team has wrong number of players.');
          return false;
        }
        for (const p of team.players) {
          if (typeof p.name !== 'string' || typeof p.handicap !== 'number') {
            alert('Invalid scoresheet: player data is malformed.');
            return false;
          }
        }
      }
      sheet.id = generateId();
      sheet.updatedAt = new Date().toISOString();
      if (!sheet.createdAt) sheet.createdAt = sheet.updatedAt;
      state.scoresheets.push(sheet);
      saveToStorage();
      renderHome();
      return true;
    } catch (err) {
      alert('Failed to import: ' + err.message);
      return false;
    }
  }

  window.importScoresheet = function(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      importSheetFromJSON(e.target.result);
    };
    reader.readAsText(file);
    event.target.value = '';
  };

  // Drag-and-drop
  function setupDropZone() {
    const dropZone = document.getElementById('drop-zone');
    if (!dropZone) return;

    dropZone.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.stopPropagation();
      this.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', function(e) {
      e.preventDefault();
      e.stopPropagation();
      this.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', function(e) {
      e.preventDefault();
      e.stopPropagation();
      this.classList.remove('dragover');

      const files = e.dataTransfer.files;
      if (files.length === 0) return;
      const file = files[0];
      if (!file.name.endsWith('.json')) {
        alert('Please drop a .json file.');
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        if (importSheetFromJSON(e.target.result)) {
          dropZone.innerHTML = '<div class="icon">✅</div><p>Imported successfully!</p>';
          setTimeout(() => {
            dropZone.innerHTML = '<div class="icon">📂</div><p><strong>Drop a .json file here</strong> or click to import</p>';
          }, 2000);
        }
      };
      reader.readAsText(file);
    });
  }

  // ==================== SAVE GAME / SAVE AS COMPLETED ====================

  window.saveGameAsJSON = function(id) {
    const sheet = state.scoresheets.find(s => s.id === id);
    if (!sheet) return;
    const filename = (sheet.name || 'scoresheet').replace(/\s+/g, '_') + '.json';
    downloadJSON(sheet, filename);
  };

  window.saveAsCompleted = function(id) {
    const sheet = state.scoresheets.find(s => s.id === id);
    if (!sheet) return;
    const completedName = sheet.name + ' - Completed';
    const completed = JSON.parse(JSON.stringify(sheet));
    completed.name = completedName;
    completed.completed = true;
    completed.id = generateId();
    completed.updatedAt = new Date().toISOString();
    state.scoresheets.push(completed);
    saveToStorage();
    const filename = completedName.replace(/\s+/g, '_') + '.json';
    downloadJSON(completed, filename);
    showHome();
  };

  // ==================== EDIT SCORESHEET ====================

  window.editScoresheet = function(id) {
    const sheet = state.scoresheets.find(s => s.id === id);
    if (!sheet) return;
    state.currentEditId = id;
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById('screen-setup').classList.remove('hidden');
    populateSetup(sheet);
  };

  function populateSetup(sheet) {
    document.getElementById('setup-title').textContent = 'Edit Scoresheet';
    document.getElementById('setup-name').value = sheet.name;
    document.getElementById('setup-course').value = sheet.courseName;
    document.getElementById('setup-slope').value = sheet.slope;
    document.getElementById('setup-players').value = sheet.playersPerTeam;

    const container = document.getElementById('teams-container');
    container.innerHTML = '';
    state._teamCounter = 0;

    for (const team of sheet.teams) {
      state._teamCounter++;
      const total = sheet.playersPerTeam;
      const block = document.createElement('div');
      block.className = 'team-block';
      block.dataset.teamIndex = state._teamCounter - 1;

      let playersHtml = '';
      for (let i = 0; i < total; i++) {
        const player = team.players[i] || { name: '', handicap: '' };
        const label = getPlayerLabel(i, total);
        const rate = getPlayerRate(i, total);
        const ratePct = Math.round(rate * 100);
        playersHtml += `
          <div class="player-row">
            <div class="player-label" title="${ratePct}% of handicap">${label}</div>
            <div class="form-group">
              <input type="text" class="player-name" placeholder="Player name" data-idx="${i}" value="${escHtml(player.name)}">
            </div>
            <div class="form-group">
              <input type="number" class="player-hcp" placeholder="Handicap" step="0.1" min="0" max="54" data-idx="${i}" value="${player.handicap !== undefined ? player.handicap : ''}">
            </div>
          </div>
        `;
      }

      block.innerHTML = `
        <div class="team-block-header">
          <h3>Team <span class="team-number">${state._teamCounter}</span></h3>
          <button class="btn btn-sm btn-danger" onclick="removeTeam(this)">Remove</button>
        </div>
        <div class="form-group" style="margin-bottom:10px;">
          <input type="text" class="team-name" placeholder="Team name (optional)" style="width:100%;padding:8px 10px;border:1.5px solid #d4d4d4;border-radius:8px;font-size:0.9rem;" value="${escHtml(team.name || '')}">
        </div>
        <div class="team-players">${playersHtml}</div>
      `;
      block.dataset.teamId = team.id;

      container.appendChild(block);
    }
  }

  // ==================== SETUP SCREEN ====================

  function resetSetup() {
    document.getElementById('setup-title').textContent = 'New Scoresheet';
    document.getElementById('setup-name').value = '';
    document.getElementById('setup-course').value = '';
    document.getElementById('setup-slope').value = '113';
    document.getElementById('setup-players').value = '4';
    state._teamCounter = 0;
    const container = document.getElementById('teams-container');
    container.innerHTML = '';
    addTeam();
  }

  window.onPlayersPerTeamChange = function() {
    const select = document.getElementById('setup-players');
    const count = parseInt(select.value, 10);
    const container = document.getElementById('teams-container');
    const teamBlocks = container.querySelectorAll('.team-block');
    for (const block of teamBlocks) {
      const playersDiv = block.querySelector('.team-players');
      const currentRows = playersDiv.querySelectorAll('.player-row');
      const currentCount = currentRows.length;

      if (currentCount < count) {
        for (let i = currentCount; i < count; i++) {
          playersDiv.appendChild(createPlayerRow(i, count));
        }
      } else if (currentCount > count) {
        for (let i = currentCount - 1; i >= count; i--) {
          currentRows[i].remove();
        }
      }
      const rows = playersDiv.querySelectorAll('.player-row');
      rows.forEach((row, idx) => {
        const label = row.querySelector('.player-label');
        label.textContent = getPlayerLabel(idx, count);
      });
    }
  };

  function getPlayerLabel(index, total) {
    if (total === 2) return index === 0 ? 'A' : 'B';
    if (total === 3) return ['A', 'B', 'C'][index];
    return ['A', 'B', 'C', 'D'][index];
  }

  function getPlayerRate(index, total) {
    const rates = {
      2: [0.35, 0.10],
      3: [0.20, 0.15, 0.10],
      4: [0.20, 0.15, 0.10, 0.05]
    };
    return (rates[total] || [])[index] || 0;
  }

  function createPlayerRow(index, total) {
    const div = document.createElement('div');
    div.className = 'player-row';
    const label = getPlayerLabel(index, total);
    const rate = getPlayerRate(index, total);
    const ratePct = Math.round(rate * 100);
    div.innerHTML = `
      <div class="player-label" title="${ratePct}% of handicap">${label}</div>
      <div class="form-group">
        <input type="text" class="player-name" placeholder="Player name" data-idx="${index}">
      </div>
      <div class="form-group">
        <input type="number" class="player-hcp" placeholder="Handicap" step="0.1" min="0" max="54" data-idx="${index}">
      </div>
    `;
    return div;
  }

  window.addTeam = function() {
    const container = document.getElementById('teams-container');
    const select = document.getElementById('setup-players');
    const total = parseInt(select.value, 10);
    state._teamCounter = (state._teamCounter || 0) + 1;
    const teamNum = state._teamCounter;

    const block = document.createElement('div');
    block.className = 'team-block';
    block.dataset.teamIndex = teamNum - 1;

    block.innerHTML = `
      <div class="team-block-header">
        <h3>Team <span class="team-number">${teamNum}</span></h3>
        <button class="btn btn-sm btn-danger" onclick="removeTeam(this)">Remove</button>
      </div>
      <div class="form-group" style="margin-bottom:10px;">
        <input type="text" class="team-name" placeholder="Team name (optional)" style="width:100%;padding:8px 10px;border:1.5px solid #d4d4d4;border-radius:8px;font-size:0.9rem;">
      </div>
      <div class="team-players"></div>
    `;

    const playersDiv = block.querySelector('.team-players');
    for (let i = 0; i < total; i++) {
      playersDiv.appendChild(createPlayerRow(i, total));
    }

    container.appendChild(block);
  };

  window.removeTeam = function(btn) {
    const block = btn.closest('.team-block');
    if (document.querySelectorAll('.team-block').length <= 1) {
      alert('You need at least one team.');
      return;
    }
    block.remove();
    const blocks = document.querySelectorAll('.team-block');
    blocks.forEach((b, idx) => {
      b.querySelector('.team-number').textContent = idx + 1;
    });
  };

  function gatherTeamsFromSetup() {
    const teamBlocks = document.querySelectorAll('.team-block');
    const teams = [];
    for (const block of teamBlocks) {
      const teamName = block.querySelector('.team-name').value.trim() || '';
      const nameInputs = block.querySelectorAll('.player-name');
      const hcpInputs = block.querySelectorAll('.player-hcp');

      const players = [];
      let valid = true;
      for (let i = 0; i < nameInputs.length; i++) {
        const pName = nameInputs[i].value.trim();
        const pHcp = parseFloat(hcpInputs[i].value);
        if (!pName) { alert('Enter a name for all players.'); valid = false; break; }
        if (isNaN(pHcp) || pHcp < 0 || pHcp > 54) { alert('Enter a valid handicap (0-54) for all players.'); valid = false; break; }
        players.push({ name: pName, handicap: pHcp });
      }
      if (!valid) return null;

      teams.push({
        id: block.dataset.teamId || generateId(),
        name: teamName,
        players: players,
        totalScore: null
      });
    }
    return teams;
  }

  window.saveScoresheet = function() {
    const name = document.getElementById('setup-name').value.trim();
    const courseName = document.getElementById('setup-course').value.trim();
    const slope = parseInt(document.getElementById('setup-slope').value, 10);
    const playersPerTeam = parseInt(document.getElementById('setup-players').value, 10);

    if (!name) { alert('Enter a tournament name.'); return; }
    if (!courseName) { alert('Enter a course name.'); return; }
    if (isNaN(slope) || slope < 55 || slope > 155) { alert('Enter a valid slope rating (55-155).'); return; }

    const teamBlocks = document.querySelectorAll('.team-block');
    if (teamBlocks.length === 0) { alert('Add at least one team.'); return; }

    const teams = gatherTeamsFromSetup();
    if (!teams) return;

    const now = new Date().toISOString();

    if (state.currentEditId) {
      const existing = state.scoresheets.find(s => s.id === state.currentEditId);
      if (existing) {
        const oldScores = {};
        for (const oldTeam of existing.teams) {
          if (oldTeam.totalScore !== null && oldTeam.totalScore !== undefined) {
            oldScores[oldTeam.id] = oldTeam.totalScore;
          }
        }
        for (const newTeam of teams) {
          if (oldScores[newTeam.id] !== undefined) {
            newTeam.totalScore = oldScores[newTeam.id];
          }
        }
        existing.name = name;
        existing.courseName = courseName;
        existing.slope = slope;
        existing.playersPerTeam = playersPerTeam;
        existing.teams = teams;
        existing.updatedAt = now;
        saveToStorage();
        showScoresheet(existing.id);
        return;
      }
    }

    const sheet = {
      id: generateId(),
      name: name,
      courseName: courseName,
      slope: slope,
      playersPerTeam: playersPerTeam,
      teams: teams,
      createdAt: now,
      updatedAt: now
    };

    state.scoresheets.push(sheet);
    saveToStorage();
    showScoresheet(sheet.id);
  };

  // ==================== HANDICAP CALC ====================

  function calcTeamHandicap(players, playersPerTeam) {
    const sorted = [...players].sort((a, b) => a.handicap - b.handicap);
    const rates = {
      2: [0.35, 0.10],
      3: [0.20, 0.15, 0.10],
      4: [0.20, 0.15, 0.10, 0.05]
    };
    const rate = rates[playersPerTeam];
    if (!rate) return 0;
    const total = sorted.reduce((sum, p, i) => sum + (rate[i] || 0) * p.handicap, 0);
    return Math.round(total * 10) / 10;
  }

  function calcTeamHandicapBreakdown(players, playersPerTeam) {
    const sorted = [...players].sort((a, b) => a.handicap - b.handicap);
    const rates = {
      2: [0.35, 0.10],
      3: [0.20, 0.15, 0.10],
      4: [0.20, 0.15, 0.10, 0.05]
    };
    const rate = rates[playersPerTeam];
    if (!rate) return { parts: [], total: 0 };
    const parts = sorted.map((p, i) => ({
      name: p.name,
      handicap: p.handicap,
      rate: rate[i] || 0,
      contribution: Math.round((rate[i] || 0) * p.handicap * 10) / 10
    }));
    const total = parts.reduce((sum, p) => sum + p.contribution, 0);
    return { parts, total: Math.round(total * 10) / 10 };
  }

  // ==================== SCORESHEET SCREEN ====================

  function renderScoresheet(id) {
    const sheet = state.scoresheets.find(s => s.id === id);
    if (!sheet) { showHome(); return; }

    const container = document.getElementById('scoresheet-content');
    const actionsBar = document.getElementById('scoresheet-actions');

    // Actions bar
    let hasScores = sheet.teams.some(t => t.totalScore !== null && t.totalScore !== undefined && t.totalScore !== '');
    let allScoresIn = sheet.teams.every(t => t.totalScore !== null && t.totalScore !== undefined && t.totalScore !== '');
    actionsBar.innerHTML = `
      <button class="btn btn-sm btn-warning" onclick="editScoresheet('${sheet.id}')">✏️ Edit Game</button>
      <button class="btn btn-sm btn-secondary" onclick="saveGameAsJSON('${sheet.id}')">💾 Save Game</button>
      ${hasScores ? `<button class="btn btn-sm btn-success" onclick="saveAsCompleted('${sheet.id}')">✅ Save as Completed</button>` : ''}
    `;

    let html = `
      <div class="card">
        <div class="card-title">${escHtml(sheet.name)} ${sheet.completed ? '<span class="completed-badge">Completed</span>' : ''}</div>
        <div class="meta-grid">
          <div class="meta-item"><strong>Course:</strong> ${escHtml(sheet.courseName)}</div>
          <div class="meta-item"><strong>Slope:</strong> ${sheet.slope}</div>
          <div class="meta-item"><strong>Players/Team:</strong> ${sheet.playersPerTeam}</div>
          <div class="meta-item"><strong>Teams:</strong> ${sheet.teams.length}</div>
        </div>
      </div>
    `;

    html += `<div class="card" style="padding:0;overflow-x:auto;"><table class="scoresheet-table"><thead><tr>
      <th>Team</th>
      <th>Players (sorted by handicap)</th>
      <th>Team HCP</th>
      <th>Breakdown</th>
      <th>Total Score</th>
      <th>Net Score</th>
    </tr></thead><tbody>`;

    const hasAnyScores = sheet.teams.some(t => t.holeScores && t.holeScores.some(s => s !== null && s !== ''));
    const sortedTeams = [...sheet.teams].sort((a, b) => {
      const aHcp = calcTeamHandicap(a.players, sheet.playersPerTeam);
      const bHcp = calcTeamHandicap(b.players, sheet.playersPerTeam);
      if (!hasAnyScores) return aHcp - bHcp;
      const aAllHoles = a.holeScores && a.holeScores.every(s => s !== null && s !== '');
      const bAllHoles = b.holeScores && b.holeScores.every(s => s !== null && s !== '');
      if (aAllHoles && !bAllHoles) return -1;
      if (!aAllHoles && bAllHoles) return 1;
      if (!aAllHoles && !bAllHoles) return aHcp - bHcp;
      const aNet = a.holeScores.reduce((x, y) => x + y, 0) - aHcp;
      const bNet = b.holeScores.reduce((x, y) + y, 0) - bHcp;
      return aNet - bNet;
    });

    let allScoresEntered = true;
    const teamResults = sortedTeams.map(team => {
      const teamHcp = calcTeamHandicap(team.players, sheet.playersPerTeam);
      const netScore = team.totalScore !== null && team.totalScore !== undefined && team.totalScore !== '' ? team.totalScore - teamHcp : null;
      if (team.totalScore === null || team.totalScore === undefined || team.totalScore === '') {
        allScoresEntered = false;
      }
      return { team, teamHcp, netScore };
    });

    let minNet = Infinity;
    let winnerIds = new Set();
    if (allScoresEntered) {
      for (const r of teamResults) {
        if (r.netScore !== null && r.netScore < minNet) {
          minNet = r.netScore;
          winnerIds = new Set([r.team.id]);
        } else if (r.netScore !== null && r.netScore === minNet) {
          winnerIds.add(r.team.id);
        }
      }
    }

    for (const r of teamResults) {
      const team = r.team;
      const teamHcp = r.teamHcp;
      const netScore = r.netScore;
      const isWinner = winnerIds.has(team.id);
      const sortedPlayers = [...team.players].sort((a, b) => a.handicap - b.handicap);
      const breakdown = calcTeamHandicapBreakdown(team.players, sheet.playersPerTeam);

      const playerNames = sortedPlayers.map(p => `${escHtml(p.name)} (${p.handicap})`).join(', ');
      const breakdownStr = breakdown.parts.map(p => `${p.handicap}×${p.rate}=${p.contribution}`).join(' + ');
      const breakdownFull = `${breakdownStr} = ${breakdown.total}`;

      html += `<tr class="${isWinner ? 'winner-row' : ''}">
        <td class="team-name-cell">${team.name || escHtml(sortedPlayers[0]?.name || 'Team')}${isWinner ? ' 🏆' : ''}</td>
        <td><div class="players-list">${playerNames}</div></td>
        <td class="hcp-cell">${teamHcp}</td>
        <td style="font-size:0.78rem;color:#666;max-width:200px;">${breakdownFull}</td>
        <td style="text-align:center;">
          <input type="number" class="score-input" value="${team.totalScore !== null && team.totalScore !== undefined ? team.totalScore : ''}"
                 onchange="updateTeamScore('${sheet.id}','${team.id}',this.value)" min="0" max="200">
        </td>
        <td class="net-cell">${netScore !== null ? netScore.toFixed(1) : '—'}</td>
      </tr>`;
    }

    html += '</tbody></table></div>';

    if (allScoresEntered && winnerIds.size > 0) {
      const winnerTeams = sortedTeams.filter(t => winnerIds.has(t.id));
      for (const wt of winnerTeams) {
        const hcp = calcTeamHandicap(wt.players, sheet.playersPerTeam);
        const net = wt.totalScore - hcp;
        const sortedP = [...wt.players].sort((a, b) => a.handicap - b.handicap);
        const nameList = sortedP.map(p => p.name).join(', ');
        html += `
          <div class="winner-banner">
            <div class="trophy">🏆</div>
            <h2>Winner: ${escHtml(wt.name || sortedP[0]?.name || 'Team')}</h2>
            <p>Players: ${escHtml(nameList)} &middot; Net Score: ${net.toFixed(1)} (${wt.totalScore} - ${hcp})</p>
          </div>`;
      }
    }

    container.innerHTML = html;
    saveToStorage();
  }

  window.updateTeamScore = function(sheetId, teamId, value) {
    const sheet = state.scoresheets.find(s => s.id === sheetId);
    if (!sheet) return;
    const team = sheet.teams.find(t => t.id === teamId);
    if (!team) return;
    team.totalScore = (value === '' || value === null || value === undefined) ? null : parseFloat(value);
    sheet.updatedAt = new Date().toISOString();
    saveToStorage();
    renderScoresheet(sheetId);
  };

  // ==================== HELPERS ====================

  function escHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ==================== INIT ====================

  loadFromStorage();
  renderHome();
  setupDropZone();

})();
</script>
